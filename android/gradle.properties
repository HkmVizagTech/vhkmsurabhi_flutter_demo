org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Skip auto-downloading missing SDK components (e.g. NDK) - not needed since
# this app has no native/JNI code, and the bundled sdkmanager can't parse the
# current repository manifest schema anyway.
android.builder.sdkDownload=false
# Force Gradle offline: with a warm dependency cache this also makes the
# Flutter Gradle plugin skip its sdkmanager-based NDK provisioning step
# (broken here - see above) and fall back to its synthetic no-NDK build path.
org.gradle.offline=true
